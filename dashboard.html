<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Protected Area</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 700;
      font-size: 1.25rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-signout {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-signout:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 1.5rem;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      background-color: #f1f5f9;
    }

    .user-info h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
    }

    .user-info p {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background-color: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
    }

    .dashboard-body p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #334155;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="brand">
      <span>⚡</span>
      <span>My Dashboard</span>
    </div>
    <!-- 4. Sign Out Button -->
    <button id="signOutBtn" class="btn-signout" onclick="signOut()">Sign Out</button>
  </header>

  <!-- Protected Page Content -->
  <main>
    <div class="card">
      <div class="user-profile">
        <!-- User Avatar from Google Account -->
        <img id="userAvatar" class="avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Profile Avatar" />
        
        <div class="user-info">
          <!-- 6. Displayed Name and Email dynamically populated -->
          <h2 id="userName">Loading user...</h2>
          <p id="userEmail">Checking session...</p>
          <div class="badge">
            <span class="badge-dot"></span>
            Authenticated via Google OAuth
          </div>
        </div>
      </div>

      <div class="dashboard-body">
        <p>Welcome! This page is protected by your Supabase Auth guard. Only users with an active session can see this content. If you sign out or clear cookies, you will automatically be redirected back to the login page.</p>
      </div>
    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- SCRIPT INCLUSIONS (ORDER IS CRITICAL!)                                   -->
  <!-- ========================================================================= -->
  <!-- 1. Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Your Supabase Client Config & Initialization -->
  <script src="supabaseClient.js"></script>

  <!-- 3. Your Authentication & Guard Functions -->
  <script src="auth.js"></script>

  <!-- 4. Execute Auth Guard as soon as the page loads -->
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      // 5. Check for valid session; if none, redirects to login.html
      await requireAuth();
    });
  </script>
</body>
</html>
