<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" name="viewport"/>
  <title>Sign In · SmartQueue Healthcare</title>

  <!-- PWA Meta Tags & Icons -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#101828"/>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

  <style>
    /* Background Pattern & Ambient Glows */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    .pattern-waves {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f8fafc;
      z-index: 0;
      pointer-events: none;
    }

    .pattern-waves::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-radial-gradient(
        circle at 0% 50%,
        rgba(0, 0, 0, 0.026) 0px,
        rgba(0, 0, 0, 0.026) 1.5px,
        transparent 1.5px,
        transparent 30px
      );
    }

    .hero-glow-blob-1 {
      position: absolute;
      top: -100px;
      left: 15%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    .hero-glow-blob-2 {
      position: absolute;
      bottom: 50px;
      right: 15%;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.10) 0%, rgba(14, 165, 233, 0.05) 50%, transparent 70%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════════════════════════════════
       USER LOGIN FORM STYLES
       ══════════════════════════════════════════════════════════ */
    .form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #ffffff;
      padding: 30px;
      width: 450px;
      border-radius: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    ::placeholder {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .form button {
      align-self: flex-end;
    }

    .flex-column > label {
      color: #151717;
      font-weight: 600;
    }

    .inputForm {
      border: 1.5px solid #ecedec;
      border-radius: 10px;
      height: 50px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      transition: 0.2s ease-in-out;
    }

    .input {
      margin-left: 10px;
      border-radius: 10px;
      border: none;
      width: 85%;
      height: 100%;
    }

    .input:focus {
      outline: none;
    }

    .inputForm:focus-within {
      border: 1.5px solid #2d79f3;
    }

    .flex-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .flex-row > div > label {
      font-size: 14px;
      color: black;
      font-weight: 400;
    }

    .span {
      font-size: 14px;
      margin-left: 5px;
      color: #2d79f3;
      font-weight: 500;
      cursor: pointer;
    }

    .button-submit {
      margin: 20px 0 10px 0;
      background-color: #151717;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      border-radius: 10px;
      height: 50px;
      width: 100%;
      cursor: pointer;
    }

    .button-submit:hover {
      background-color: #252727;
    }

    .p {
      text-align: center;
      color: black;
      font-size: 14px;
      margin: 5px 0;
    }

    .btn {
      margin-top: 10px;
      width: 100%;
      height: 50px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 500;
      gap: 10px;
      border: 1px solid #ededef;
      background-color: white;
      cursor: pointer;
      transition: 0.2s ease-in-out;
    }

    .btn:hover {
      border: 1px solid #2d79f3;
    }

    /* ══════════════════════════════════════════════════════════
       RESPONSIVE & POLISH ENHANCEMENTS
       ══════════════════════════════════════════════════════════ */
    * {
      box-sizing: border-box;
    }

    .form {
      max-width: 100%;
      box-shadow: 0 20px 45px rgba(16, 24, 40, 0.08), 0 1px 3px rgba(16, 24, 40, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
      z-index: 10;
    }

    .inputForm {
      padding-right: 12px;
    }

    .eye-toggle-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.15s ease;
      color: #64748b;
      margin-left: auto;
    }
    .eye-toggle-btn:hover {
      color: #0f172a;
      background-color: #f1f5f9;
    }

    .p.line {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 13px;
      margin: 12px 0 6px 0;
    }
    .p.line::before, .p.line::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }

    .alert-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      animation: fadeIn 0.2s ease;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .alert-banner.success {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .alert-banner.error {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-banner.info {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .form-error-text {
      display: none;
      color: #dc2626;
      font-size: 13px;
      text-align: center;
      margin-top: 6px;
      font-weight: 500;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      .form {
        width: 100%;
        padding: 24px 20px;
        border-radius: 16px;
      }
    }
  </style>
</head>

  <!-- Supabase Auth Script -->
  <script type="module">
    import { supabase } from '/src/supabaseClient.js';

    // UI Elements
    const form = document.getElementById('signInForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusAlert = document.getElementById('statusAlert');
    const formErrorMessage = document.getElementById('formErrorMessage');
    const rememberMe = document.getElementById('rememberMe');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
    const googleBtn = document.getElementById('googleSignInBtn');
    const appleBtn = document.getElementById('appleSignInBtn');

    // Helper: Show Banner Above Form
    function showAlert(msg, type = 'error') {
      if (!statusAlert) return;
      statusAlert.className = 'alert-banner ' + type;
      statusAlert.innerHTML = msg;
      statusAlert.style.display = 'flex';
    }

    function hideAlert() {
      if (statusAlert) statusAlert.style.display = 'none';
    }

    // Helper: Show Small Error Message Under Form
    function showError(msg) {
      if (formErrorMessage) {
        formErrorMessage.textContent = msg;
        formErrorMessage.style.display = 'block';
      }
      showAlert(msg, 'error');
    }

    function hideError() {
      if (formErrorMessage) {
        formErrorMessage.textContent = '';
        formErrorMessage.style.display = 'none';
      }
      hideAlert();
    }

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      if (!passwordInput || !eyeIcon) return;
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l496 392c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7l-86.4-68.3C493 299.7 530.8 261 548.8 240c-25.8-31-89.9-96-180.8-128l-52.9 52.9c37.1 16.4 69.4 43.1 91 75.1-40.4 60.1-102.3 96-166.1 96-22.7 0-44.8-4.7-65-13.6L129.5 368c48.8 28.3 103.3 44 158.5 44 142.2 0 252-95.6 280.8-124.6 6.4-6.4 6.4-16.8 0-23.2C530.2 225.4 425.2 128 288 128c-30.8 0-60.8 4.9-89.1 14.2L68.8 36.3 38.8 5.1zM288 176c44.2 0 80 35.8 80 80 0 10.9-2.2 21.3-6.2 30.8l-104.6-104.6c9.5-4 19.9-6.2 30.8-6.2zM87.2 214.6C127.6 154.5 189.5 118.6 253.3 118.6c13.7 0 27.2 1.6 40.2 4.8l-37.3 37.3C240.5 160.2 224.5 160 208 160c-53 0-96 43-96 96 0 16.5.2 32.5.7 48.2L87.2 214.6z"/>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.5 78.1-95.4 93-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C433.5 68.8 368.8 32 288 32zM144 256a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm144-64c0 35.3-28.7 64-64 64c-7.1 0-13.9-1.2-20.3-3.3c-5.5-1.8-11.9 1.6-11.7 7.4c.3 6.9 1.3 13.8 3.2 20.7c13.7 51.2 66.4 81.6 117.6 67.9s81.6-66.4 67.9-117.6c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3z"/>';
      }
    }
    if (togglePasswordBtn) togglePasswordBtn.addEventListener('click', togglePasswordVisibility);

    // Initial check: query params & remembered email
    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const registered = urlParams.get('registered');
      const emailParam = urlParams.get('email');

      // 1. If user came from a successful signup:
      if (registered === 'true' || urlParams.get('signup') === 'success') {
        if (emailParam && emailInput) {
          emailInput.value = emailParam;
          if (passwordInput) passwordInput.focus();
        }
        showAlert('Your account has been created. Please check your email and verify your address before logging in.', 'success');
      } else {
        // Pre-fill remembered email
        try {
          const savedEmail = localStorage.getItem('smartqueue_remember_email');
          if (savedEmail && emailInput) {
            emailInput.value = savedEmail;
            if (rememberMe) rememberMe.checked = true;
          }
        } catch (e) {}

        // Check if existing Supabase session exists
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            showAlert(`You are already signed in as <strong>${session.user?.email}</strong>. <a href="/" class="underline font-bold ml-1">Continue to Home &rarr;</a>`, 'info');
          }
        } catch (e) {}
      }
    });

    // Handle Sign In Submit
    async function handleSignIn(e) {
      e.preventDefault();
      hideError();

      const email = emailInput ? emailInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value : '';

      if (!email || !email.includes('@')) {
        showError('Please enter a valid email address.');
        if (emailInput) emailInput.focus();
        return;
      }

      if (!password) {
        showError('Please enter your password.');
        if (passwordInput) passwordInput.focus();
        return;
      }

      // Remember me handling
      try {
        if (rememberMe && rememberMe.checked) {
          localStorage.setItem('smartqueue_remember_email', email);
        } else {
          localStorage.removeItem('smartqueue_remember_email');
        }
      } catch (e) {}

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        // 2) Supabase signInWithPassword({ email, password })
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          let msg = error.message || 'Invalid login credentials.';
          if (msg.toLowerCase().includes('invalid login credentials')) {
            msg = 'Invalid login credentials. If you just signed up, please verify your email address in your inbox first (or disable "Confirm email" in Supabase Dashboard &rarr; Auth &rarr; Providers &rarr; Email).';
          }
          showError(msg);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return;
        }

        // Only redirect when a real session exists after login
        if (data && data.session) {
          const userName = data.user?.user_metadata?.full_name || email.split('@')[0];
          
          // Save session to localStorage for app-wide UI sync
          try {
            localStorage.setItem('smartqueue_user', JSON.stringify({
              email: data.user?.email || email,
              name: userName,
              id: data.user?.id,
              loggedIn: true,
              loginTime: new Date().toISOString()
            }));
          } catch (e) {}

          showAlert('✓ Signed in successfully! Redirecting to Home...', 'success');

          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const returnUrl = urlParams.get('redirect') || '/';
            window.location.href = returnUrl;
          }, 600);
        } else {
          // If no session exists (e.g. email unconfirmed)
          showError('Check your email and confirm your account before logging in.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (err) {
        showError(err.message || 'An unexpected error occurred during sign in.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    if (form) form.addEventListener('submit', handleSignIn);

    // Forgot password flow
    if (forgotPasswordBtn) {
      forgotPasswordBtn.addEventListener('click', async () => {
        hideError();
        const email = emailInput ? emailInput.value.trim() : '';
        if (!email) {
          showError('Please enter your email above first to receive a password reset link.');
          if (emailInput) emailInput.focus();
          return;
        }
        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/login.html'
          });
          if (error) {
            showError(error.message);
          } else {
            showAlert(`✓ Password reset email sent to <strong>${email}</strong>. Check your inbox!`, 'success');
          }
        } catch (err) {
          showError(err.message);
        }
      });
    }

    // Social OAuth Logins
    async function handleSocialSignIn(provider) {
      hideError();
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: provider,
          options: {
            redirectTo: window.location.origin + '/'
          }
        });
        if (error) showError(error.message);
      } catch (err) {
        showError(err.message);
      }
    }

    if (googleBtn) googleBtn.addEventListener('click', () => handleSocialSignIn('google'));
    if (appleBtn) appleBtn.addEventListener('click', () => handleSocialSignIn('apple'));
  </script>
