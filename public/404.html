<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>404 - Page Not Found · SmartQueue</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & Montserrat (for the 404 text) -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>

  <style>
    /* Waves Pattern Background */
    .pattern-waves {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f8fafc;
      z-index: 0;
      pointer-events: none;
    }

    .pattern-waves::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-radial-gradient(
        circle at 0% 50%,
        rgba(0, 0, 0, 0.026) 0px,
        rgba(0, 0, 0, 0.026) 1.5px,
        transparent 1.5px,
        transparent 30px
      );
    }

    /* Design Inspired by Stefan Devai on Dribbble */
    .main_wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30em;
      height: 26em;
      position: relative;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5em;
    }

    .antenna {
      width: 5em;
      height: 5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #f27405;
      margin-bottom: -6em;
      margin-left: 0em;
      z-index: -1;
    }
    .antenna_shadow {
      position: absolute;
      background-color: transparent;
      width: 50px;
      height: 56px;
      margin-left: 1.68em;
      border-radius: 45%;
      transform: rotate(140deg);
      border: 4px solid transparent;
      box-shadow:
        inset 0px 16px #a85103,
        inset 0px 16px 1px 1px #a85103;
      -moz-box-shadow:
        inset 0px 16px #a85103,
        inset 0px 16px 1px 1px #a85103;
    }
    .antenna::after {
      content: "";
      position: absolute;
      margin-top: -9.4em;
      margin-left: 0.4em;
      transform: rotate(-25deg);
      width: 1em;
      height: 0.5em;
      border-radius: 50%;
      background-color: #f69e50;
    }
    .antenna::before {
      content: "";
      position: absolute;
      margin-top: 0.2em;
      margin-left: 1.25em;
      transform: rotate(-20deg);
      width: 1.5em;
      height: 0.8em;
      border-radius: 50%;
      background-color: #f69e50;
    }
    .a1 {
      position: relative;
      top: -102%;
      left: -130%;
      width: 12em;
      height: 5.5em;
      border-radius: 50px;
      background-image: linear-gradient(
        #171717,
        #171717,
        #353535,
        #353535,
        #171717
      );
      transform: rotate(-29deg);
      clip-path: polygon(50% 0%, 49% 100%, 52% 100%);
    }
    .a1d {
      position: relative;
      top: -211%;
      left: -35%;
      transform: rotate(45deg);
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #979797;
      z-index: 99;
    }
    .a2 {
      position: relative;
      top: -210%;
      left: -10%;
      width: 12em;
      height: 4em;
      border-radius: 50px;
      background-color: #171717;
      background-image: linear-gradient(
        #171717,
        #171717,
        #353535,
        #353535,
        #171717
      );
      margin-right: 5em;
      clip-path: polygon(
        47% 0,
        47% 0,
        34% 34%,
        54% 25%,
        32% 100%,
        29% 96%,
        49% 32%,
        30% 38%
      );
      transform: rotate(-8deg);
    }
    .a2d {
      position: relative;
      top: -294%;
      left: 94%;
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #979797;
      z-index: 99;
    }

    .notfound_text {
      background-color: black;
      padding-left: 0.4em;
      padding-right: 0.4em;
      padding-top: 0.1em;
      padding-bottom: 0.1em;
      font-size: 0.75em;
      color: white;
      letter-spacing: 0.05em;
      border-radius: 5px;
      z-index: 10;
      font-family: Montserrat, sans-serif;
    }
    .tv {
      width: 17em;
      height: 9em;
      margin-top: 3em;
      border-radius: 15px;
      background-color: #d36604;
      display: flex;
      justify-content: center;
      border: 2px solid #1d0e01;
      box-shadow: inset 0.2em 0.2em #e69635;
      position: relative;
    }
    .tv::after {
      content: "";
      position: absolute;
      width: 17em;
      height: 9em;
      border-radius: 15px;
      background:
        repeating-radial-gradient(#d36604 0 0.0001%, #00000070 0 0.0002%) 50% 0/2500px
          2500px,
        repeating-conic-gradient(#d36604 0 0.0001%, #00000070 0 0.0002%) 60% 60%/2500px
          2500px;
      background-blend-mode: difference;
      opacity: 0.09;
    }
    .curve_svg {
      position: absolute;
      margin-top: 0.25em;
      margin-left: -0.25em;
      height: 12px;
      width: 12px;
    }
    .display_div {
      display: flex;
      align-items: center;
      align-self: center;
      justify-content: center;
      border-radius: 15px;
      box-shadow: 3.5px 3.5px 0px #e69635;
    }
    .screen_out {
      width: auto;
      height: auto;
      border-radius: 10px;
    }
    .screen_out1 {
      width: 11em;
      height: 7.75em;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }
    .screen {
      width: 13em;
      height: 7.85em;
      font-family: Montserrat, sans-serif;
      border: 2px solid #1d0e01;
      background:
        repeating-radial-gradient(#000 0 0.0001%, #ffffff 0 0.0002%) 50% 0/2500px
          2500px,
        repeating-conic-gradient(#000 0 0.0001%, #ffffff 0 0.0002%) 60% 60%/2500px
          2500px;
      background-blend-mode: difference;
      animation: b 0.2s infinite alternate;
      border-radius: 10px;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #252525;
      letter-spacing: 0.15em;
      text-align: center;
    }

    .screenM {
      width: 13em;
      height: 7.85em;
      position: relative;
      font-family: Montserrat, sans-serif;
      background: linear-gradient(
        to right,
        #002fc6 0%,
        #002bb2 14.2857142857%,
        #3a3a3a 14.2857142857%,
        #303030 28.5714285714%,
        #ff0afe 28.5714285714%,
        #f500f4 42.8571428571%,
        #6c6c6c 42.8571428571%,
        #626262 57.1428571429%,
        #0affd9 57.1428571429%,
        #00f5ce 71.4285714286%,
        #3a3a3a 71.4285714286%,
        #303030 85.7142857143%,
        white 85.7142857143%,
        #fafafa 100%
      );
      border-radius: 10px;
      border: 2px solid black;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #252525;
      letter-spacing: 0.15em;
      text-align: center;
      overflow: hidden;
    }
    .screenM:before,
    .screenM:after {
      content: "";
      position: absolute;
      left: 0;
      z-index: 1;
      width: 100%;
    }
    .screenM:before {
      top: 0;
      height: 68.4782608696%;
      background: linear-gradient(
        to right,
        white 0%,
        #fafafa 14.2857142857%,
        #ffe60a 14.2857142857%,
        #f5dc00 28.5714285714%,
        #0affd9 28.5714285714%,
        #00f5ce 42.8571428571%,
        #10ea00 42.8571428571%,
        #0ed600 57.1428571429%,
        #ff0afe 57.1428571429%,
        #f500f4 71.4285714286%,
        #ed0014 71.4285714286%,
        #d90012 85.7142857143%,
        #002fc6 85.7142857143%,
        #002bb2 100%
      );
    }
    .screenM:after {
      bottom: 0;
      height: 21.7391304348%;
      background: linear-gradient(
        to right,
        #006c6b 0%,
        #005857 16.6666666667%,
        white 16.6666666667%,
        #fafafa 33.3333333333%,
        #001b75 33.3333333333%,
        #001761 50%,
        #6c6c6c 50%,
        #626262 66.6666666667%,
        #929292 66.6666666667%,
        #888888 83.3333333333%,
        #3a3a3a 83.3333333333%,
        #303030 100%
      );
    }

    @keyframes b {
      100% {
        background-position:
          50% 0,
          60% 50%;
      }
    }

    .lines {
      display: flex;
      column-gap: 0.1em;
      align-self: flex-end;
    }
    .line1,
    .line3 {
      width: 2px;
      height: 0.5em;
      background-color: black;
      border-radius: 25px 25px 0px 0px;
      margin-top: 0.5em;
    }
    .line2 {
      flex-grow: 1;
      width: 2px;
      height: 1em;
      background-color: black;
      border-radius: 25px 25px 0px 0px;
    }

    .buttons_div {
      width: 4.25em;
      align-self: center;
      height: 8em;
      background-color: #e69635;
      border: 2px solid #1d0e01;
      padding: 0.6em;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      row-gap: 0.75em;
      box-shadow: 3px 3px 0px #e69635;
    }
    .b1 {
      width: 1.65em;
      height: 1.65em;
      border-radius: 50%;
      background-color: #7f5934;
      border: 2px solid black;
      box-shadow:
        inset 2px 2px 1px #b49577,
        -2px 0px #513721,
        -2px 0px 0px 1px black;
    }
    .b1::before {
      content: "";
      position: absolute;
      margin-top: 1em;
      margin-left: 0.5em;
      transform: rotate(47deg);
      border-radius: 5px;
      width: 0.1em;
      height: 0.4em;
      background-color: #000000;
    }
    .b1::after {
      content: "";
      position: absolute;
      margin-top: 0.9em;
      margin-left: 0.8em;
      transform: rotate(47deg);
      border-radius: 5px;
      width: 0.1em;
      height: 0.55em;
      background-color: #000000;
    }
    .b1 div {
      content: "";
      position: absolute;
      margin-top: -0.1em;
      margin-left: 0.65em;
      transform: rotate(45deg);
      width: 0.15em;
      height: 1.5em;
      background-color: #000000;
    }
    .b2 {
      width: 1.65em;
      height: 1.65em;
      border-radius: 50%;
      background-color: #7f5934;
      border: 2px solid black;
      box-shadow:
        inset 2px 2px 1px #b49577,
        -2px 0px #513721,
        -2px 0px 0px 1px black;
    }
    .b2::before {
      content: "";
      position: absolute;
      margin-top: 1.05em;
      margin-left: 0.8em;
      transform: rotate(-45deg);
      border-radius: 5px;
      width: 0.15em;
      height: 0.4em;
      background-color: #000000;
    }
    .b2::after {
      content: "";
      position: absolute;
      margin-top: -0.1em;
      margin-left: 0.65em;
      transform: rotate(-45deg);
      width: 0.15em;
      height: 1.5em;
      background-color: #000000;
    }
    .speakers {
      display: flex;
      flex-direction: column;
      row-gap: 0.5em;
    }
    .speakers .g1 {
      display: flex;
      column-gap: 0.25em;
    }
    .speakers .g1 .g11,
    .g12,
    .g13 {
      width: 0.65em;
      height: 0.65em;
      border-radius: 50%;
      background-color: #7f5934;
      border: 2px solid black;
      box-shadow: inset 1.25px 1.25px 1px #b49577;
    }
    .speakers .g {
      width: auto;
      height: 2px;
      background-color: #171717;
    }

    .bottom {
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      column-gap: 8.7em;
    }
    .base1 {
      height: 1em;
      width: 2em;
      border: 2px solid #171717;
      background-color: #4d4d4d;
      margin-top: -0.15em;
      z-index: -1;
    }
    .base2 {
      height: 1em;
      width: 2em;
      border: 2px solid #171717;
      background-color: #4d4d4d;
      margin-top: -0.15em;
      z-index: -1;
    }
    .base3 {
      position: absolute;
      height: 0.15em;
      width: 17.5em;
      background-color: #171717;
      margin-top: 0.8em;
    }

    .text_404 {
      position: absolute;
      display: flex;
      flex-direction: row;
      column-gap: 6em;
      z-index: -5;
      margin-bottom: 2em;
      align-items: center;
      justify-content: center;
      opacity: 0.16;
      font-family: Montserrat, sans-serif;
      font-weight: 900;
      color: #101828;
      user-select: none;
      pointer-events: none;
    }
    .text_4041 {
      transform: scaleY(24.5) scaleX(9);
    }
    .text_4042 {
      transform: scaleY(24.5) scaleX(9);
    }
    .text_4043 {
      transform: scaleY(24.5) scaleX(9);
    }

    @media only screen and (max-width: 495px) {
      .text_404 {
        column-gap: 6em;
      }
      .main_wrapper {
        transform: scale(0.85);
      }
    }
    @media only screen and (max-width: 395px) {
      .text_404 {
        column-gap: 4em;
      }
      .text_4041 {
        transform: scaleY(25) scaleX(8);
      }
      .text_4042 {
        transform: scaleY(25) scaleX(8);
      }
      .text_4043 {
        transform: scaleY(25) scaleX(8);
      }
      .main_wrapper {
        transform: scale(0.72);
      }
    }

    @media (max-width: 275px), (max-height: 520px) {
      .main {
        position: relative;
      }
    }

    @media only screen and (max-width: 1024px) {
      .screenM {
        display: flex;
      }
      .screen {
        display: none;
      }
    }
    @media only screen and (min-width: 1025px) {
      .screen {
        display: flex;
      }
      .screenM {
        display: none;
      }
    }
  </style>
</head>

<body class="bg-[#f8fafc] text-[#101828] font-sans antialiased min-h-screen flex flex-col justify-between relative selection:bg-slate-900 selection:text-white">

  <!-- Background Wave Pattern -->
  <div class="pattern-waves"></div>

  <!-- Top Simple Brand Header -->
  <header class="w-full relative z-10 max-w-5xl mx-auto px-6 pt-6 sm:pt-8 flex items-center justify-between">
    <a class="inline-flex items-center gap-2.5 group" href="index.html">
      <div class="w-8 h-8 rounded-lg bg-black flex items-center justify-center text-white shadow-sm transition-transform group-hover:scale-105">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
        </svg>
      </div>
      <span class="font-bold text-base sm:text-lg text-[#101828] tracking-tight">SmartQueue</span>
    </a>

    <a href="index.html" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-[#D0D5DD] bg-white hover:bg-slate-50 text-[#344054] transition shadow-xs">
      Home
    </a>
  </header>

  <!-- Central 404 Container -->
  <main class="relative z-10 flex flex-col items-center justify-center px-4 py-8 flex-grow">
    
    <!-- Stefan Devai Retro TV Illustration -->
    <div class="main_wrapper">
      <div class="main">
        <div class="antenna">
          <div class="antenna_shadow"></div>
          <div class="a1"></div>
          <div class="a1d"></div>
          <div class="a2"></div>
          <div class="a2d"></div>
          <div class="a_base"></div>
        </div>
        <div class="tv">
          <div class="cruve">
            <svg
              class="curve_svg"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              viewBox="0 0 189.929 189.929"
              xml:space="preserve"
            >
              <path
                d="M70.343,70.343c-30.554,30.553-44.806,72.7-39.102,115.635l-29.738,3.951C-5.442,137.659,11.917,86.34,49.129,49.13
            C86.34,11.918,137.664-5.445,189.928,1.502l-3.95,29.738C143.041,25.54,100.895,39.789,70.343,70.343z"
              ></path>
            </svg>
          </div>
          <div class="display_div">
            <div class="screen_out">
              <div class="screen_out1">
                <div class="screen">
                  <span class="notfound_text">NOT FOUND</span>
                </div>
                <div class="screenM">
                  <span class="notfound_text">NOT FOUND</span>
                </div>
              </div>
            </div>
          </div>
          <div class="lines">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
          </div>
          <div class="buttons_div">
            <div class="b1"><div></div></div>
            <div class="b2"></div>
            <div class="speakers">
              <div class="g1">
                <div class="g11"></div>
                <div class="g12"></div>
                <div class="g13"></div>
              </div>
              <div class="g"></div>
              <div class="g"></div>
            </div>
          </div>
        </div>
        <div class="bottom">
          <div class="base1"></div>
          <div class="base2"></div>
          <div class="base3"></div>
        </div>
      </div>
      <div class="text_404">
        <div class="text_4041">4</div>
        <div class="text_4042">0</div>
        <div class="text_4043">4</div>
      </div>
    </div>

    <!-- Error Copy & Return Actions -->
    <div class="text-center max-w-md mt-6 space-y-3">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-[#101828]">
        Signal Lost · Page Not Found
      </h1>
      <p class="text-sm text-[#475467] leading-relaxed">
        The consultation link, doctor profile, or page you are looking for does not exist or has been moved.
      </p>

      <div class="pt-3 flex flex-col sm:flex-row items-center justify-center gap-3">
        <a href="index.html" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg bg-[#101828] text-white text-sm font-semibold hover:bg-slate-800 transition shadow-xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
          Back to SmartQueue
        </a>
        <a href="index.html" onclick="sessionStorage.setItem('openScreen', '5')" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg border border-[#D0D5DD] bg-white text-[#344054] text-sm font-semibold hover:bg-slate-50 transition shadow-xs">
          Live Tokens
        </a>
      </div>
    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="relative z-10 w-full text-center py-6 text-xs text-[#98A2B3]">
    &copy; 2026 SmartQueue · All rights reserved. · Customer Support: <a href="mailto:smartqueue70@gmail.com" class="text-blue-600 hover:underline font-medium">smartqueue70@gmail.com</a>
  </footer>

</body>
</html>
